<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.description }}">
<link rel="canonical" href="{{ page.canonical }}">
{% if page.og %}
<meta property="og:type" content="website">
<meta property="og:title" content="{{ page.title }}">
<meta property="og:description" content="{{ page.og_description | default: page.description }}">
<meta property="og:url" content="{{ page.canonical }}">
<meta property="og:image" content="/assets/img/og-farm.jpg"><!-- PLACEHOLDER: 1200x630 -->
{% endif %}

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Karla:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
{% if page.schema %}
{% include {{ page.schema }} %}
{% endif %}
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

{% include header.html %}

<main id="main">
{{ content }}
</main>

{% include footer.html %}

<script src="assets/site.js"></script>
</body>
</html>
